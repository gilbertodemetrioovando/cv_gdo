<section id="proyectos" class="page-shell fade-in">
  <div class="container">
    <p class="section-label">Portafolio</p>
    <h1 class="section-title">Proyectos destacados</h1>
    <p class="section-lead">
      Selección de iniciativas relevantes a partir de mi experiencia profesional.
    </p>

    <div class="row g-4">
      @for (project of cv.projects; track project.title) {
        <div class="col-md-6">
          <article class="project-card" [attr.data-accent]="project.accent">
            <div class="project-media">
              <div class="media-art" aria-hidden="true"></div>
              <a href="#contacto" class="open-btn" [attr.aria-label]="'Contactar sobre ' + project.title">
                <i class="bi bi-arrow-up-right"></i>
              </a>
            </div>
            <div class="project-body">
              <span class="company">{{ project.company }}</span>
              <h2>{{ project.title }}</h2>
              <p>{{ project.description }}</p>
              <div class="tags">
                @for (tech of project.tech; track tech) {
                  <span class="tech-pill">{{ tech }}</span>
                }
              </div>
            </div>
          </article>
        </div>
      }
    </div>
  </div>
</section>
